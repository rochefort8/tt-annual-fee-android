apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace 'com.tokyotochikukai.annualfee.square'
  compileSdkVersion rootProject.ext.compileSdkVersion

  repositories {
    mavenLocal()
    mavenCentral()
    google()
  }

  defaultConfig {
    applicationId 'com.tokyotochikukai.annualfee.square'
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.compileSdkVersion
    versionCode 1
    versionName '1.0'
  }

  buildTypes {
    debug {
      project.addClientIdField(buildTypes.debug)
      project.addDevPaymentBypassField(buildTypes.debug, true)
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
      project.addClientIdField(buildTypes.release)
      project.addDevPaymentBypassField(buildTypes.release, false)
    }
  }

  packagingOptions {
    resources {
      excludes += [
        'META-INF/INDEX.LIST',
        'META-INF/DEPENDENCIES',
        'META-INF/LICENSE',
        'META-INF/LICENSE.txt',
        'META-INF/NOTICE',
        'META-INF/NOTICE.txt'
      ]
    }
  }
}

configurations.all {
  resolutionStrategy {
    force 'com.google.errorprone:error_prone_annotations:2.28.0'
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'com.squareup.sdk:point-of-sale-sdk:2.1'
}

void addClientIdField(def buildType) {
  def propsFile = rootProject.file('local.properties')
  if (!propsFile.exists()) {
    throw new GradleException('Please create local.properties with squareClientId="sq0idp-..."')
  }

  def props = new Properties()
  props.load(new FileInputStream(propsFile))
  def clientId = props['squareClientId']

  if (clientId == null || clientId.toString().trim().isEmpty()) {
    throw new GradleException('Please set squareClientId in local.properties')
  }

  def normalizedClientId = clientId.toString().trim()
  if (!normalizedClientId.startsWith('"')) {
    normalizedClientId = '"' + normalizedClientId + '"'
  }

  buildType.buildConfigField 'String', 'CLIENT_ID', normalizedClientId
}

void addDevPaymentBypassField(def buildType, boolean allowFromLocalProperties) {
  boolean bypassEnabled = false

  if (allowFromLocalProperties) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
      def props = new Properties()
      props.load(new FileInputStream(propsFile))
      def rawBypassFlag = props['squareDevPaymentBypass']?.toString()?.trim()?.toLowerCase()
      bypassEnabled = rawBypassFlag == 'true'
    }
  }

  buildType.buildConfigField 'boolean', 'DEV_PAYMENT_BYPASS', bypassEnabled ? 'true' : 'false'
}
