apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace 'com.tokyotochikukai.annualfee.square'
  compileSdkVersion rootProject.ext.compileSdkVersion

  repositories {
    mavenLocal()
    mavenCentral()
    google()
  }

  defaultConfig {
    applicationId 'com.tokyotochikukai.annualfee.square'
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.compileSdkVersion
    versionCode 1
    versionName '1.0'
  }

  buildTypes {
    debug {
      project.addClientIdField(buildTypes.debug)
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
      project.addClientIdField(buildTypes.release)
    }
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'com.squareup.sdk:point-of-sale-sdk:2.1'
}

void addClientIdField(def buildType) {
  def propsFile = rootProject.file('local.properties')
  if (!propsFile.exists()) {
    throw new GradleException('Please create local.properties with squareClientId="sq0idp-..."')
  }

  def props = new Properties()
  props.load(new FileInputStream(propsFile))
  def clientId = props['squareClientId']

  if (clientId == null || clientId.toString().trim().isEmpty()) {
    throw new GradleException('Please set squareClientId in local.properties')
  }

  def normalizedClientId = clientId.toString().trim()
  if (!normalizedClientId.startsWith('"')) {
    normalizedClientId = '"' + normalizedClientId + '"'
  }

  buildType.buildConfigField 'String', 'CLIENT_ID', normalizedClientId
}
